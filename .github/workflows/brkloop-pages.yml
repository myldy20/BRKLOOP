name: BRKLOOP web groovebox
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: brkloop-pages
  cancel-in-progress: true
jobs:
  build:
    name: Build SLOOP DSP and static app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install Pillow
          sudo apt-get update -qq
          sudo apt-get install -y clang lld
      - name: Build factory bank from SLOOP
        run: node tools/build_brkloop_bank.mjs
      - name: Audit original SLOOP descriptors and factory names
        run: node tools/audit_brkloop_parity.mjs
      - name: Test experimental shared Step/Roll command model
        run: node tests/shared_edit_commands_test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: brkloop-sloop-parity-report
          path: dist/audit/
          retention-days: 14
      - name: Build browser AudioWorklet DSP
        run: python tools/build_preview.py
      - name: Compile and compare all native factory presets
        run: |
          mkdir -p build/host
          clang -O2 -fwrapv -fno-strict-aliasing -w -Ibuild/gen -Ifirmware/src research/native_factory_dump.c -o build/host/native_factory_dump
          node tools/compare_native_factory.mjs
          node tests/factory_preset_migration_test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: brkloop-native-factory-audit
          path: dist/audit/native-factory*
          retention-days: 14
      - name: Probe SLOOP 2.7 continuation flag bridge (known gap)
        run: |
          mkdir -p build/host
          clang -O2 -fwrapv -fno-strict-aliasing -w -Ibuild/gen -Ifirmware/src tests/preview_continuation_probe.c -o build/host/preview_continuation_probe
          build/host/preview_continuation_probe
      - name: Verify SLOOP's native/WASM audio equivalence
        run: sh tests/run_preview_tests.sh
      - name: Validate BRKLOOP scripts and assets
        run: |
          node --check app.js
          node --check web/preview.js
          node --check web/preview-worklet.js
          test -s dist/bank.json
          test -s build/preview/sloop-preview.wasm
      - name: Assemble static Pages site
        run: |
          mkdir -p dist/site/web
          cp index.html styles.css app.js dist/site/
          cp web/preview.js web/preview-worklet.js dist/site/web/
          cp build/preview/sloop-preview.wasm dist/site/web/
          cp dist/bank.json dist/site/bank.json
          cp LICENSE LICENSING.md dist/site/
          touch dist/site/.nojekyll
      - name: Browser regression (phone + desktop)
        run: |
          npm install --no-save --no-audit --no-fund playwright-core@1.56.1
          node tests/brkloop_browser_test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brkloop-ui-shots
          path: ui-shots
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist/site
  deploy:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4